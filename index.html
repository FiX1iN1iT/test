<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запуск TBusiness</title>
    <!-- Подключаем скрипт Telegram, чтобы иметь возможность закрыть WebApp -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
        }
        .loader {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="loader">
        <h3>Переходим в приложение...</h3>
    </div>

    <script>
        // Инициализируем Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();

        // Пытаемся сразу открыть ваш диплинк
        window.location.href = "tbusiness://salary";

        // Через 500 миллисекунд закрываем шторку WebApp в Telegram,
        // чтобы пользователь сразу вернулся в чат с ботом
        setTimeout(() => {
            tg.close();
        }, 500);
    </script>
</body>
</html>
